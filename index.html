<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mohammad Maher Asaad | Portfolio</title>
<meta name="description" content="Mohammad Maher Asaad — Computer Science graduate, tech content creator and digital marketer based in Amman, Jordan.">
<meta property="og:type" content="website">
<meta property="og:title" content="Mohammad Maher Asaad | Portfolio">
<meta property="og:description" content="Computer Science graduate, tech content creator and digital marketer based in Amman, Jordan.">
<meta property="og:url" content="https://mohmaherasaadportfolio.vercel.app/">
<meta property="og:image" content="https://mohmaherasaadportfolio.vercel.app/images/profile.jpg">
<meta name="twitter:image" content="https://mohmaherasaadportfolio.vercel.app/images/profile.jpg">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🚀</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="preloader" id="preloader">
    <div class="preloader-ring"></div>
</div>

<button class="back-to-top" id="backToTop" aria-label="Back to top">↑</button>

<header class="navbar" id="navbar">
    <div class="nav-container">
        <a href="#home" class="logo" id="logoText"></a>

        <nav class="nav-menu" id="navMenu">
            <a href="#home" class="nav-link active" data-i18n="nav.home"></a>
            <a href="#about" class="nav-link" data-i18n="nav.about"></a>
            <a href="#experience" class="nav-link" data-i18n="nav.experience"></a>
            <a href="#campaigns" class="nav-link" data-i18n="nav.campaigns"></a>
            <a href="#projects" class="nav-link" data-i18n="nav.projects"></a>
            <a href="#contact" class="nav-link" data-i18n="nav.contact"></a>
        </nav>

        <div class="nav-actions">
            <button class="lang-toggle" id="langToggle">EN</button>
            <button type="button" class="menu-toggle" id="menuToggle" aria-label="Menu" aria-controls="navMenu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
        </div>
    </div>
</header>

<section class="hero" id="home">
    <div class="hero-blob blob-1"></div>
    <div class="hero-blob blob-2"></div>

    <div class="hero-container">
        <div class="hero-text" data-aos>
            <p class="hero-greeting" data-i18n="hero.greeting"></p>
            <h1 class="hero-name" id="heroName"></h1>
            <h2 class="hero-role" id="heroRole"></h2>
            <p class="hero-tagline" id="heroTagline"></p>

            <div class="hero-buttons">
                <a href="#contact" class="btn btn-primary" data-i18n="hero.cta1"></a>
                <a href="#projects" class="btn btn-outline" data-i18n="hero.cta2"></a>
            </div>

            <div class="hero-socials" id="heroSocials"></div>
        </div>

        <div class="hero-photo" data-aos>
            <div class="photo-frame">
                <img class="photo-img" src="images/profile.jpg" alt="Mohammad Maher Asaad">
            </div>
        </div>
    </div>

    <div class="side-deco side-start" aria-hidden="true"></div>
    <div class="side-deco side-end" aria-hidden="true"></div>

    <a href="#about" class="scroll-indicator" aria-label="scroll down"><span></span></a>
</section>

<section class="section about-section" id="about">
    <div class="side-deco side-start" aria-hidden="true"></div>
    <div class="side-deco side-end" aria-hidden="true"></div>
    <div class="section-inner">
        <div class="section-header" data-aos>
            <h2 class="section-title" data-i18n="about.title"></h2>
            <p class="section-subtitle" data-i18n="about.subtitle"></p>
        </div>

        <div class="about-content">
            <blockquote class="about-quote" id="aboutQuote" data-aos></blockquote>

            <div class="education-block" data-aos>
                <h3 class="education-title" data-i18n="about.educationTitle"></h3>
                <div class="education-list" id="educationList"></div>
            </div>
        </div>
    </div>
</section>

<section class="section experience-section" id="experience">
    <div class="side-deco side-start" aria-hidden="true"></div>
    <div class="side-deco side-end" aria-hidden="true"></div>
    <div class="section-inner">
        <div class="section-header" data-aos>
            <h2 class="section-title" data-i18n="experience.title"></h2>
            <p class="section-subtitle" data-i18n="experience.subtitle"></p>
        </div>

        <div class="timeline" id="timelineList"></div>
    </div>
</section>

<section class="section campaigns-section" id="campaigns">
    <div class="side-deco side-start" aria-hidden="true"></div>
    <div class="side-deco side-end" aria-hidden="true"></div>
    <div class="section-inner">
        <div class="section-header" data-aos>
            <h2 class="section-title" data-i18n="campaigns.title"></h2>
            <p class="section-subtitle" data-i18n="campaigns.subtitle"></p>
        </div>

        <div class="stats-grid" id="statsGrid"></div>
    </div>
</section>

<section class="section projects-section" id="projects">
    <div class="side-deco side-start" aria-hidden="true"></div>
    <div class="side-deco side-end" aria-hidden="true"></div>
    <div class="section-inner">
        <div class="section-header" data-aos>
            <h2 class="section-title" data-i18n="projects.title"></h2>
            <p class="section-subtitle" data-i18n="projects.subtitle"></p>
        </div>

        <div class="tabs" id="projectTabs"></div>
        <div class="projects-grid" id="projectsGrid"></div>
    </div>
</section>

<section class="section contact-section" id="contact">
    <div class="side-deco side-start" aria-hidden="true"></div>
    <div class="side-deco side-end" aria-hidden="true"></div>
    <div class="section-inner">
        <div class="section-header" data-aos>
            <h2 class="section-title" data-i18n="contact.title"></h2>
            <p class="section-subtitle" data-i18n="contact.subtitle"></p>
        </div>

        <div class="contact-wrap">
            <div class="contact-info" data-aos>
                <h3 data-i18n="contact.infoTitle"></h3>
                <div id="contactInfoList"></div>
                <div class="hero-socials" id="contactSocials"></div>
            </div>

            <form class="contact-form" id="contactForm" data-aos>
                <div class="form-group">
                    <label for="name" data-i18n="contact.form.name"></label>
                    <input type="text" id="name" name="name" required>
                </div>
                <div class="form-group">
                    <label for="email" data-i18n="contact.form.email"></label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="subject" data-i18n="contact.form.subject"></label>
                    <input type="text" id="subject" name="subject" required>
                </div>
                <div class="form-group">
                    <label for="message" data-i18n="contact.form.message"></label>
                    <textarea id="message" name="message" rows="5" required></textarea>
                </div>
                <input type="text" name="_honey" class="form-honeypot" tabindex="-1" autocomplete="off" aria-hidden="true">
                <button type="submit" class="btn btn-primary" data-i18n="contact.form.submit"></button>
                <p class="form-status" id="formStatus" role="status" aria-live="polite"></p>
            </form>
        </div>
    </div>
</section>

<footer class="footer">
    <p id="footerText"></p>
</footer>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true">
    <button type="button" class="lightbox-close" id="lightboxClose" data-i18n-label="lightbox.close">✕</button>
    <div class="lightbox-content" id="lightboxContent"></div>
</div>

<div class="image-zoom" id="imageZoom">
    <img id="imageZoomImg" src="" alt="">
</div>

<script src="js/data.js"></script>
<script src="js/script.js"></script>
</body>
</html>
